name: Ludo Quiz Android APK 1.0.10
on:
  push:
    branches: [build/ludo-quiz-v1.0.10-temas-simples]
    paths: ['ludo-quiz/**', '.github/workflows/ludo-quiz-android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ludo-quiz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile debug APK with Android SDK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Validate final APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | tee badging.txt
          grep -q "package: name='com.ludoquiz.app.nova110'" badging.txt
          grep -q "versionName='1.0.10'" badging.txt
          grep -q "launchable-activity: name='com.ludoquiz.app.MainActivity'" badging.txt
          for F in topics.js index.html effects.js effects.css themes.js themes.css dual.js dual.css diagnostics.js bank.js photo.js capture.js v108.css; do
            test "$(unzip -p app/build/outputs/apk/debug/app-debug.apk "assets/$F" | sha256sum | cut -d ' ' -f 1)" = "$(sha256sum "app/src/main/assets/$F" | cut -d ' ' -f 1)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Ludo_Quiz_v1.0.10_Android_SDK_APK
          path: ludo-quiz/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
